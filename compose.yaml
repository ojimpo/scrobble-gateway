services:
  scrobble-gateway:
    build:
      context: .
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    # 認証を決めるまではホストのループバックにだけ出す。Tailscale 内で検証する段階で
    # MCP_BIND_ADDRESS=0.0.0.0 にする（4100〜4103 は既存 MCP / cosense-mcp 管理画面）。
    ports:
      - "${MCP_BIND_ADDRESS:-127.0.0.1}:${MCP_PUBLIC_PORT:-4104}:${MCP_PORT:-3000}"
    # scrobble のマスター DB。named volume ではなく bind mount にして、
    # health.db と同じくホストからバックアップ・照合できるようにする。
    volumes:
      - ./data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:'+(process.env.MCP_PORT||3000)+'/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
