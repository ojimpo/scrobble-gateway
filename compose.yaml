services:
  scrobble-gateway:
    build:
      context: .
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    # 既定はループバックだけ。arigato-nas では .env の MCP_BIND_ADDRESS=0.0.0.0 で
    # 既存 MCP と同じく Tailscale / LAN にも出している（4100〜4103 は既存 MCP / cosense-mcp 管理画面）。
    # 外から来る Host は MCP_ALLOWED_HOSTS で絞られる。
    ports:
      - "${MCP_BIND_ADDRESS:-127.0.0.1}:${MCP_PUBLIC_PORT:-4104}:${MCP_PORT:-3000}"
    # scrobble のマスター DB。named volume ではなく bind mount にして、
    # health.db と同じくホストからバックアップ・照合できるようにする。
    volumes:
      - ./data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:'+(process.env.MCP_PORT||3000)+'/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

# 自前のネットワークは作らず health-ojimpo のネットワークに相乗りする。
# arigato-nas は Docker の既定アドレスプールを使い切っていて、新しいネットワークを
# 作れない（"all predefined address pools have been fully subnetted"）。
# health-ojimpo の backend からは http://scrobble-gateway:3000 で届く。
networks:
  default:
    name: health-ojimpo_default
    external: true
