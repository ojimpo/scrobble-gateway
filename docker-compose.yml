services:
  lastfm-mcp:
    build:
      context: .
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    ports:
      - "${MCP_BIND_ADDRESS:-127.0.0.1}:${MCP_PUBLIC_PORT:-3000}:${MCP_PORT:-3000}"
    volumes:
      - lastfm-data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:'+(process.env.MCP_PORT||3000)+'/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  lastfm-data:
